services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Reuses Vikunja's already-encrypted Gmail SMTP creds for notification
    # env vars only - env_file injects into the container's runtime env, it
    # does not feed this file's own ${...} interpolation (same pattern
    # monitoring/docker-compose.yml uses for postgres-exporter).
    env_file: ../vikunja/.env
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_SCHEDULE: "0 0 5 * * *"
      WATCHTOWER_TIMEOUT: "60s"
      TZ: "America/New_York"
      WATCHTOWER_HTTP_API_METRICS: "true"
      # Not a real secret: this port is only reachable over the internal
      # `monitoring_internal` docker network, never published to the host.
      # It exists only because Watchtower's metrics feature requires a token
      # to enable at all. Must match monitoring/prometheus/prometheus.yml.
      WATCHTOWER_HTTP_API_TOKEN: "b54c8dd5dbbfd4cdcaa58e3f8a6a0aea"
      # Email fires only when a scan actually updates or fails a container -
      # WATCHTOWER_NOTIFICATION_REPORT renders to nothing (no email) on a
      # run with zero updates and zero failures.
      WATCHTOWER_NOTIFICATIONS: "email"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_NOTIFICATION_EMAIL_TO: "bradmartin333@gmail.com"
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER: "smtp.gmail.com"
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT: "587"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # env_file above injects VIKUNJA_MAILER_USERNAME/PASSWORD into this
    # container's runtime env, but that's a different name than what
    # watchtower reads - map them at start rather than duplicating the
    # secret into a second env var name (same reasoning as
    # monitoring/docker-compose.yml's postgres-exporter entrypoint).
    entrypoint:
      - /bin/sh
      - -c
      - 'export WATCHTOWER_NOTIFICATION_EMAIL_FROM="$$VIKUNJA_MAILER_USERNAME" && export WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER="$$VIKUNJA_MAILER_USERNAME" && export WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD="$$VIKUNJA_MAILER_PASSWORD" && exec /watchtower'
    networks:
      - monitoring_internal

networks:
  monitoring_internal:
    external: true
