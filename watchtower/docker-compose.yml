services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # SMTP creds for notifications. The nickfedor/watchtower image is
    # distroless (no /bin/sh), so there's no way to remap another app's
    # env var names into watchtower's expected ones at container start -
    # unlike postgres-exporter's entrypoint trick, this has to be its own
    # .env with watchtower's exact var names, even though the value is the
    # same Gmail app password already used in vikunja/.env.
    env_file: .env
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_SCHEDULE: "0 0 5 * * *"
      WATCHTOWER_TIMEOUT: "60s"
      TZ: "America/New_York"
      WATCHTOWER_HTTP_API_METRICS: "true"
      # Not a real secret: this port is only reachable over the internal
      # `monitoring_internal` docker network, never published to the host.
      # It exists only because Watchtower's metrics feature requires a token
      # to enable at all. Must match monitoring/prometheus/prometheus.yml.
      WATCHTOWER_HTTP_API_TOKEN: "b54c8dd5dbbfd4cdcaa58e3f8a6a0aea"
      # WATCHTOWER_NOTIFICATION_REPORT only controls what data the notification
      # template receives (a structured session report vs. raw log lines) - it
      # does NOT by itself suppress the email on a no-op run. Left on because
      # the custom template below needs .Updated/.Failed/.Restarted/.Fresh.
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      # Email fires only when a scan actually updates, fails, or restarts a
      # container. The whole template is wrapped in this if-guard so a run
      # with none of those renders to an empty string, and shoutrrr sends
      # nothing when the rendered template is empty.
      WATCHTOWER_NOTIFICATION_TEMPLATE: |
        {{- if ( or .Updated .Failed .Restarted ) -}}
        {{len .Scanned}} Scanned, {{len .Updated}} Updated, {{len .Restarted}} Restarted, {{len .Failed}} Failed
        {{- range .Updated}}
        - {{.Name}} ({{.ImageName}}): {{.CurrentImageID.ShortID}} updated to {{.LatestImageID.ShortID}}
        {{- end -}}
        {{- range .Fresh}}
        - {{.Name}} ({{.ImageName}}): {{.State}}
        {{- end -}}
        {{- range .Restarted}}
        - {{.Name}} ({{.ImageName}}): {{.State}}
        {{- end -}}
        {{- range .Skipped}}
        - {{.Name}} ({{.ImageName}}): {{.State}}: {{.Error}}
        {{- end -}}
        {{- range .Failed}}
        - {{.Name}} ({{.ImageName}}): {{.State}}: {{.Error}}
        {{- end -}}
        {{- end -}}
      # Shoutrrr URL form, not the legacy WATCHTOWER_NOTIFICATION_EMAIL_* vars
      # - those are deprecated and log a warning on every startup. The full
      # smtp:// URL (including the percent-encoded "@" in the username) lives
      # in .env since it embeds the Gmail app password.
      # WATCHTOWER_NOTIFICATION_URL is injected via env_file (.env)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring_internal

networks:
  monitoring_internal:
    external: true
