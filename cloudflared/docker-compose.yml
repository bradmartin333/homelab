services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - /srv/docker-data/cloudflared:/home/nonroot/.cloudflared
    networks:
      - proxy
    security_opt: [no-new-privileges:true]
    # No watchtower label on purpose. Every other watched image is pinned to a
    # tag, so watchtower can only pull patch-level movement; cloudflared on
    # :latest could cross a major version unattended at 05:00 with nothing
    # watching. It updates on an explicit `docker compose pull` instead.
    # See docs/architecture-migration.md for pinning it to a digest.

networks:
  proxy:
    external: true
