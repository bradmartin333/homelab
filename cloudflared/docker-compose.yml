services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # --metrics must bind 0.0.0.0 (not the 127.0.0.1 default) to be reachable
    # from the prometheus container over the `proxy` network.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - /srv/docker-data/cloudflared:/home/nonroot/.cloudflared
    networks:
      - proxy
    security_opt: [no-new-privileges:true]

networks:
  proxy:
    external: true
