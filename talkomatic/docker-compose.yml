services:
  talkomatic:
    build:
      context: https://github.com/bradmartin333/talkomatic-classic.git#${TALKOMATIC_BRANCH:-main}
    image: talkomatic:local
    # Giving this a real `image:` tag (so talkomatic-ops below can share it)
    # makes `docker compose pull` treat it as a registry reference and try
    # to pull it, unlike a build-only service with no `image:` key (compare
    # talkomatic-bot, which is skipped for exactly that reason). `build`
    # tells compose this is always built locally, never pulled.
    pull_policy: build
    container_name: talkomatic
    restart: unless-stopped
    env_file: .env
    security_opt: [no-new-privileges:true]
    environment:
      ALLOWED_ORIGINS: "https://${TALKOMATIC_DOMAIN}"
      TRUST_PROXY: "1"
    volumes:
      - /srv/docker-data/talkomatic:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.talkomatic.rule=Host(`${TALKOMATIC_DOMAIN}`)"
      - "traefik.http.routers.talkomatic.entrypoints=websecure"
      - "traefik.http.routers.talkomatic.tls=true"
      - "traefik.http.routers.talkomatic.tls.certresolver=cloudflare"
      - "traefik.http.routers.talkomatic.middlewares=rate-limit@file"
      - "traefik.http.services.talkomatic.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=false"

  # tools/ops.js bots sidecar (talkomatic-classic repo). Reuses the image
  # built above via the shared `image:` tag - no separate build step, so
  # redeploy.sh's rebuild of `talkomatic` keeps this current for free.
  # `network_mode: service:talkomatic` shares its network namespace so
  # list/kick/capacity still work here too (loopback auth on /operator/*,
  # see operatorOnly in server.js), while talkomatic itself never gets the
  # docker.sock/bots mounts below - those are host-root-equivalent access
  # and this is the only container here on the public `proxy` network.
  # Idle by design (`sleep infinity`); commands run via `docker compose exec`.
  talkomatic-ops:
    image: talkomatic:local
    # No `build:` of its own, and never pull it either - it only ever runs
    # the image talkomatic's own build (see pull_policy above) just produced.
    pull_policy: never
    container_name: talkomatic-ops
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    network_mode: "service:talkomatic"
    volumes:
      - ../talkomatic-bot/bots:/opt/homelab/talkomatic-bot/bots
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - talkomatic
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  proxy:
    external: true
