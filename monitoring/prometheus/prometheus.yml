global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:20241"]

  # Immich's OTEL exporter encodes the subject in the metric NAME rather than
  # in labels - immich_jobs_ocr_failed_total, immich_asset_repository_get_by_id_duration.
  # rate() strips __name__, so a dashboard can't group by it; lift the parts we
  # chart into real labels here instead. Anchored + shared by both workers so
  # the two job definitions can't drift apart.
  - job_name: immich-api
    static_configs:
      - targets: ["immich-server:8081"]
    metric_relabel_configs: &immich_metric_relabel
      - source_labels: [__name__]
        regex: 'immich_jobs_(.+)_(?:success|failed|skipped)_total'
        target_label: immich_job
        replacement: '$1'
      - source_labels: [__name__]
        regex: 'immich_(.+)_repository_(.+)_duration_(?:bucket|sum|count)'
        target_label: immich_repo
        replacement: '$1'
      - source_labels: [__name__]
        regex: 'immich_(.+)_repository_(.+)_duration_(?:bucket|sum|count)'
        target_label: immich_op
        replacement: '$2'

  - job_name: immich-microservices
    static_configs:
      - targets: ["immich-server:8082"]
    metric_relabel_configs: *immich_metric_relabel

  - job_name: vikunja
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["vikunja:3456"]

  - job_name: watchtower
    metrics_path: /v1/metrics
    authorization:
      credentials: b54c8dd5dbbfd4cdcaa58e3f8a6a0aea
    static_configs:
      - targets: ["watchtower:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: immich-postgres
    static_configs:
      - targets: ["immich-postgres-exporter:9187"]

  - job_name: talkomatic-bot
    static_configs:
      - targets: ["talkomatic-bot:8080"]

  - job_name: meals
    metrics_path: /metrics
    authorization:
      credentials: d9368934b5c3e2e5f6cee013868be97037c06189f7a761ac32f5290f9d0b247f
    static_configs:
      - targets: ["meals:8000"]
    # Only recipe count, memory, and CPU matter here — everything else the
    # app exposes (HTTP traffic, households/users, domain events, billing,
    # GC/interpreter internals) is dropped before it ever reaches the TSDB.
    # meals_recipes_total is a gauge (no _bucket/_sum/_count suffixes to
    # match); process_resident_memory_bytes and process_cpu_seconds_total are
    # exact metric names, no wildcard needed.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'meals_recipes_total|process_resident_memory_bytes|process_cpu_seconds_total'
        action: keep
