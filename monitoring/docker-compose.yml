services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file: .env
    security_opt: [no-new-privileges:true]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - /srv/docker-data/monitoring/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in monitoring/.env}:3000:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /srv/docker-data/monitoring/prometheus:/prometheus
    networks:
      - proxy
      - monitoring_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in monitoring/.env}:9090:9090"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # env_file only injects POSTGRES_USER/POSTGRES_PASSWORD into the
    # container's runtime environment - it does NOT feed compose's own
    # ${...} interpolation (that resolves against monitoring/.env, which
    # deliberately doesn't hold postgres/.env's credentials). Building
    # DATA_SOURCE_NAME in a shell at container start reuses the real
    # runtime values without duplicating the password into monitoring/.env.
    env_file: ../postgres/.env
    entrypoint:
      - /bin/sh
      - -c
      - 'export DATA_SOURCE_NAME="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/postgres?sslmode=disable" && exec /bin/postgres_exporter'
    networks:
      - db_internal
      - monitoring_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  immich-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: immich-postgres-exporter
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Same reasoning as postgres-exporter above, reusing immich/.env's
    # DB_USERNAME/DB_PASSWORD/DB_DATABASE_NAME.
    env_file: ../immich/.env
    entrypoint:
      - /bin/sh
      - -c
      - 'export DATA_SOURCE_NAME="postgresql://$$DB_USERNAME:$$DB_PASSWORD@immich-postgres:5432/$$DB_DATABASE_NAME?sslmode=disable" && exec /bin/postgres_exporter'
    networks:
      - immich_internal
      - monitoring_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
  db_internal:
    external: true
  monitoring_internal:
    external: true
  immich_internal:
