# gickup config — see gickup/docker-compose.yml for the why.
# Reference: https://github.com/cooperspencer/gickup/blob/main/conf.example.yml

source:
  github:
    # Fine-grained token owned by bradmartin333, "All repositories", read-only
    # Contents + Metadata. A fine-grained token only sees repos its owner owns,
    # which is what limits this to my repos; a classic token would also list
    # collaborator and org repos.
    - token_file: /tmp/github-token
      wiki: true
      # Repo names to skip, to keep B2 under its 10 GB free tier. Removing a
      # name here stops updates but leaves the existing mirror on disk; delete
      # /srv/docker-data/gickup/github.com/bradmartin333/<name>.git by hand to
      # drop it from future snapshots.
      exclude: []

destination:
  local:
    - path: /mirrors
      # <path>/github.com/<owner>/<repo>.git
      structured: true
      # Bare clone of every ref, updated in place with a fetch each night.
      mirror: true

# An hour ahead of homelab-backup.timer (03:00), so each night's snapshot
# picks up that night's mirrors.
cron: 0 2 * * *

metrics:
  prometheus:
    endpoint: /metrics
    listen_addr: ":6178"
