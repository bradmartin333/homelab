api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "172.20.0.0/16"   # the proxy network
    http:
      middlewares:
        - secure-headers@file
  metrics:
    address: ":8082"   # internal-only, never published to the host

metrics:
  prometheus:
    entryPoint: metrics

certificatesResolvers:
  cloudflare:
    acme:
      # email is set via ACME_EMAIL in traefik/docker-compose.yml
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"     # avoids a stale-cache "certificate never issues" trap

providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
accessLog: {}
